name: Déployer sur GitHub Pages

# Chaque envoi sur main reconstruit le site et le met en ligne.
#
# Sécurité : ce workflow ne lit aucune donnée fournie par un tiers (titre
# d'issue, message de commit, etc.). La seule interpolation est la sortie
# d'une action officielle GitHub, il n'y a donc pas de surface d'injection.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Les droits minimaux dont a besoin le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois. Si deux envois se suivent de près, le second
# attend au lieu d'écraser le premier en cours de route.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Le dossier out/ contient déjà CNAME et .nojekyll, recopiés depuis public/.
      # .nojekyll est indispensable : sans lui, GitHub ignore le dossier _next
      # dont le nom commence par un souligné, et le site sort sans style.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
